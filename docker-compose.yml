
services:

  # ==========================================
  # FRONTEND - SvelteKit / Node.js / Plotly.js
  # ==========================================

  frontend:
    image: node:26-alpine
    container_name: mbi-frontend
    working_dir: /app

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

    environment:
      PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://api:8000

    command: >
      sh -c "npm ci &&
             npm run dev -- --host 0.0.0.0"

    depends_on:
      - api

    networks:
      - frontend-network

    restart: unless-stopped


  # ==========================================
  # BACKEND - FastAPI / Python / Pandas / Plotly
  # ==========================================

  api:
    image: python:3.15-slim-trixie
    container_name: mbi-backend
    working_dir: /app

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}

    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

    depends_on:
      database:
        condition: service_healthy

    networks:
      - frontend-network
      - data-network

    restart: unless-stopped


  # ==========================================
  # DATABASE - PostgreSQL
  # ==========================================

  database:
    image: postgres:19-trixie
    container_name: mbi-database

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql

    ports:
      - "127.0.0.1:5432:5432"

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - data-network

    restart: unless-stopped

# ==========================================
# VOLUMES
# ==========================================

volumes:
  postgres-data:
  frontend-node-modules:


# ==========================================
# NETWORKS
# ==========================================

networks:
  frontend-network:

  data-network:
    internal: true
